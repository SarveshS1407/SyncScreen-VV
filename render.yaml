services:
  - type: web
    name: syncscreen-watch-party
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://syncscreen-vv.vercel.app,https://syncscreen-watch-party.onrender.com
